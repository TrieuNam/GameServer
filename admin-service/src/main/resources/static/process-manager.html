<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process Manager - Service Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-refresh {
            background: #3b82f6;
            color: white;
        }

        .btn-refresh:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .btn-kill-all {
            background: #ef4444;
            color: white;
        }

        .btn-kill-all:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .btn-back {
            background: #6b7280;
            color: white;
        }

        .btn-back:hover {
            background: #4b5563;
        }

        .btn-kill {
            background: #f59e0b;
            color: white;
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-kill:hover {
            background: #d97706;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .process-item {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            transition: all 0.3s;
        }

        .process-item:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .process-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .process-name {
            font-weight: 700;
            color: #667eea;
            font-size: 16px;
        }

        .process-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            font-size: 13px;
            color: #6b7280;
        }

        .info-row {
            display: flex;
            gap: 5px;
        }

        .info-label {
            font-weight: 600;
            color: #374151;
        }

        .port-item {
            background: linear-gradient(135deg, #667eea20 0%, #764ba220 100%);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .port-number {
            font-size: 18px;
            font-weight: 700;
            color: #667eea;
        }

        .port-info {
            font-size: 13px;
            color: #6b7280;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-java {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-running {
            background: #d1fae5;
            color: #065f46;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 18px;
        }

        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            margin-right: 5px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
            max-width: 400px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .notification.success {
            border-left: 4px solid #10b981;
        }

        .notification.error {
            border-left: 4px solid #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <span class="status-indicator"></span>
                Process Manager
            </h1>
            <div class="header-actions">
                <button class="btn btn-refresh" onclick="refreshAll()">
                    🔄 Refresh
                </button>
                <button class="btn btn-kill-all" onclick="confirmKillAll()">
                    🛑 Stop All Services
                </button>
                <a href="control-panel.html" class="btn btn-back">
                    ← Back to Control Panel
                </a>
            </div>
        </div>

        <div class="grid">
            <!-- Active Ports Card -->
            <div class="card">
                <div class="card-title">
                    🌐 Active Ports
                </div>
                <div id="ports-list">
                    <div class="loading">
                        <div class="spinner"></div>
                        Loading ports...
                    </div>
                </div>
            </div>

            <!-- Java Processes Card -->
            <div class="card">
                <div class="card-title">
                    ☕ Java Processes
                </div>
                <div id="processes-list">
                    <div class="loading">
                        <div class="spinner"></div>
                        Loading processes...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        // Load active ports
        async function loadPorts() {
            try {
                const response = await fetch(`${API_BASE}/processes/ports`);
                const ports = await response.json();
                
                const container = document.getElementById('ports-list');
                
                if (ports.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">🔌</div>
                            <div>No active ports found</div>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = ports.map(port => `
                    <div class="port-item">
                        <div>
                            <div class="port-number">Port ${port.port || 'N/A'}</div>
                            <div class="port-info">
                                PID: ${port.pid || 'N/A'} | ${port.processName || 'Unknown'}
                            </div>
                        </div>
                        ${port.pid ? `<button class="btn btn-kill" onclick="killProcess(${port.pid})">
                            Stop
                        </button>` : ''}
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('Error loading ports:', error);
                document.getElementById('ports-list').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <div>Error loading ports</div>
                    </div>
                `;
            }
        }

        // Load Java processes
        async function loadProcesses() {
            try {
                const response = await fetch(`${API_BASE}/processes/list`);
                const processes = await response.json();
                
                const container = document.getElementById('processes-list');
                
                if (processes.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">☕</div>
                            <div>No Java processes running</div>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = processes.map(proc => `
                    <div class="process-item">
                        <div class="process-header">
                            <div class="process-name">
                                ${proc.serviceName || 'Java Process'}
                                <span class="badge badge-java">Java</span>
                                <span class="badge badge-running">Running</span>
                            </div>
                            ${proc.pid ? `<button class="btn btn-kill" onclick="killProcess(${proc.pid})">
                                Stop
                            </button>` : ''}
                        </div>
                        <div class="process-info">
                            <div class="info-row">
                                <span class="info-label">PID:</span>
                                <span>${proc.pid}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Memory:</span>
                                <span>${proc.memory || 'N/A'} MB</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">CPU:</span>
                                <span>${proc.cpu != null ? proc.cpu + '%' : 'N/A'}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Started:</span>
                                <span>${proc.startTime || 'N/A'}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Port:</span>
                                <span>${proc.port || 'N/A'}</span>
                            </div>
                        </div>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('Error loading processes:', error);
                document.getElementById('processes-list').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <div>Error loading processes</div>
                    </div>
                `;
            }
        }

        // Kill a specific process
        async function killProcess(pid) {
            if (!confirm(`Stop process with PID ${pid}?`)) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/processes/kill/${pid}`, {
                    method: 'POST'
                });
                const result = await response.json();
                
                if (result.success) {
                    showNotification('success', `Process ${pid} stopped successfully`);
                    setTimeout(refreshAll, 1000);
                } else {
                    showNotification('error', result.message || 'Failed to stop process');
                }
            } catch (error) {
                console.error('Error killing process:', error);
                showNotification('error', 'Error stopping process');
            }
        }

        // Kill all Java processes
        async function confirmKillAll() {
            if (!confirm('⚠️ Stop all Java services except Admin Service?\n\nThis will stop:\n- All game services\n- Eureka, Gateway, Config, etc.\n\nAdmin Service will continue running.')) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/processes/kill-all`, {
                    method: 'POST'
                });
                const result = await response.json();
                
                if (result.success) {
                    showNotification('success', 'All services stopped successfully');
                    setTimeout(refreshAll, 1000);
                } else {
                    showNotification('error', result.message || 'Failed to stop services');
                }
            } catch (error) {
                console.error('Error killing all processes:', error);
                showNotification('error', 'Error stopping services');
            }
        }

        // Refresh all data
        function refreshAll() {
            loadPorts();
            loadProcesses();
        }

        // Show notification
        function showNotification(type, message) {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Initial load
        refreshAll();
        
        // Auto-refresh every 5 seconds
        setInterval(refreshAll, 5000);
    </script>
</body>
</html>
