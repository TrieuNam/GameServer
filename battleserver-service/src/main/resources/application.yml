server:
  port: 8082

grpc:
  server:
    port: 9082  # gRPC port — webSocket-server connects here via BattleServerGrpcClient / CombatGrpcClient

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  application:
    name: battle-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3328/game_battle?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:tpnam}
    password: ${DB_PASSWORD:121831}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379


