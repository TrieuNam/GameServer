server:
  port: 8290

spring:
  profiles:
    active: local  # Default to local profile (root/root). Use -Dspring.profiles.active=prod for production
  application:
    name: box-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:33070/game_box?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        jdbc.time_zone: UTC
        type:
          preferred_boolean_jdbc_type: TINYINT

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    connect-retries: 10
    connect-retries-interval: 5

  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  config:
    serviceName: config-service
    unpackPath: gameworld/logicconfig/unpack.json
    kaixiangPath: gameworld/logicconfig/kaixiangdaji.json

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Box service config (fallback khi config-service chưa sẵn sàng)
box:
  # Fallback unpack_item_id nếu config-service chưa load kịp.
  # Giá trị thực tế là 40004 (lấy từ unpack.json -> other -> unpack_item_id).
  # Thông thường config-service sẽ trả về giá trị này tự động.
  unpack-item-id: 40004
  compare:
    ttl-minutes: 15
  arena-ticket:
    item-id: -1

