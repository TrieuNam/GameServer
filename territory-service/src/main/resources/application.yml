server:
  port: 8360
  shutdown: graceful

grpc:
  server:
    port: 9086   # gRPC port — webSocket-server connects here

spring:
  profiles:
    active: local  # Default to local profile
  application:
    name: territory-service
  
  threads:
    virtual:
      enabled: true
  
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:33076/game_territory?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: INFO
    com.game.territory: DEBUG
    org.hibernate.SQL: DEBUG
