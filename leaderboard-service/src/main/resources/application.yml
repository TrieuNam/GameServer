server:
  port: 8480

spring:
  profiles:
    active: local  # Default to local profile
  application:
    name: leaderboard-service
  
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:33087/game_leaderboard?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:tpnam}
    password: ${DB_PASSWORD:121831}
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 7
      timeout: 5000ms

  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: leaderboard-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "org.SouthMillion.dto.event.*"
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

grpc:
  server:
    port: 9094  # gRPC port — webSocket-server connects here

logging:
  level:
    root: INFO
    com.lhp.game.leaderboard: DEBUG
