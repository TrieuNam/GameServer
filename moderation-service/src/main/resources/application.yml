server:
  port: 8570
spring:
  profiles:
    active: local  # Default to local profile
  application:
    name: moderation-service
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:33091/game_moderation?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:tpnam}
    password: ${DB_PASSWORD:121831}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 7

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: moderation-service-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

moderation:
  bad-words: "fuck,shit,damn,idiot,stupid,ass,bitch,nigger,faggot"
  max-violations: 3
  ban-duration-hours: 24
  spam-threshold: 5
  spam-window-seconds: 10
