server:
  port: 8240

grpc:
  server:
    port: 9240
    address: 0.0.0.0
    max-inbound-message-size: 4MB
    keep-alive-time: 5m
    keep-alive-timeout: 20s
    permit-keep-alive-without-calls: true

spring:
  profiles:
    active: local  # Default to local profile
  application:
    name: equip-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:33068/game_equip?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate  # Use Flyway for schema management
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    connect-retries: 10
    connect-retries-interval: 5

  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    metadata-map:
      grpc.port: 9240

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

equip:
  config:
    equipment-path: ${EQUIP_CONFIG_PATH:gameworld/item/equipment.json}
  snapshot:
    redis-prefix: ${EQUIP_SNAPSHOT_REDIS_PREFIX:equip:snapshot:}
    ttl-seconds: ${EQUIP_SNAPSHOT_TTL_SECONDS:3600}

