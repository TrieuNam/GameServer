  # P1 Services - Game Systems
  - job_name: 'item-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8220']
        labels:
          service: 'item-service'
          phase: 'P1'

  - job_name: 'bag-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8230']
