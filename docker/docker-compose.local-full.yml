# ========================================
# Docker Compose for Local Development - Full Version
# 45 MySQL containers (all services with actual database needs)
# Redis, Kafka, and Web UIs
# ========================================

networks:
  gameserver-local:
    driver: bridge

volumes:
  # MySQL volumes - P1 Core
  userdb-data:
  reportdb-data:
  boxdb-data:
  bagdb-data:
  walletdb-data:
  equipdb-data:
  shopdb-data:
  craftingdb-data:
  serverinfodb-data:
  roledb-data:
  iapverifydb-data:
  # MySQL volumes - P2 Combat & World
  arenadb-data:
  trialdb-data:
  taskdb-data:
  battleserverdb-data:
  globalserverdb-data:
  gameworlddb-data:
  starmapdb-data:
  territorydb-data:
  escortdb-data:
  worlddb-data:
  chatdb-data:
  guilddb-data:
  # MySQL volumes - P3 Enhancement & Social
  frienddb-data:
  maildb-data:
  leaderboarddb-data:
  petdb-data:
  mountdb-data:
  runedb-data:
  angeldb-data:
  artifactdb-data:
  analyticsdb-data:
  notificationdb-data:
  moderationdb-data:
  # MySQL volumes - P4 Optional
  mainfbdb-data:
  anticheatdb-data:
  # MySQL volumes - P5 New Gameplay
  lingzhudb-data:
  knightsdb-data:
  pagodadb-data:
  scrolldb-data:
  gemdb-data:
  activitydb-data:
  shizhuangdb-data:
  # MySQL volumes - Special Admin
  admindb-data:
  gmdb-data:
  # Infrastructure volumes
  redis-data:
  kafka-data:

services:
  # ========================================
  # MYSQL DATABASES - One per service
  # ========================================

  # MySQL for User/Session data
  userdb:
    image: mysql:8.0
    container_name: local-userdb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: game_user
      MYSQL_USER: tpnam
      MYSQL_PASSWORD: 121831
    ports:
      - "33061:3306"
    command: 
      - "--default-authentication-plugin=mysql_native_password"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--innodb-use-native-aio=0"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - userdb-data:/var/lib/mysql
    networks:
      - gameserver-local

