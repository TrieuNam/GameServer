spring:
  profiles:
    active: local  # Default to local profile
  application:
    name: chat-service
  
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:33080/game_chat?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  redis:
    host: localhost
    port: 6379
    database: 5

server:
  port: 8460

grpc:
  server:
    port: 9601

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    com.lhp.game.chat: DEBUG
