syntax = "proto3";

package com.southMillion.proto.angel;

import "common.proto";

option java_multiple_files = true;
option java_package = "org.SouthMillion.proto.angel";
option java_outer_classname = "AngelServiceProto";

// Angel Service gRPC definition
service AngelGrpcService {
  // Get all angels for user
  rpc GetUserAngels(GetUserAngelsRequest) returns (GetUserAngelsResponse);
  
  // Get specific angel
  rpc GetAngel(GetAngelRequest) returns (GetAngelResponse);
  
  // Unlock new angel
  rpc UnlockAngel(UnlockAngelRequest) returns (UnlockAngelResponse);
  
  // Level up angel
  rpc LevelUpAngel(LevelUpAngelRequest) returns (LevelUpAngelResponse);
  
  // Grade up angel
  rpc GradeUpAngel(GradeUpAngelRequest) returns (GradeUpAngelResponse);
  
  // Equip angel
  rpc EquipAngel(EquipAngelRequest) returns (EquipAngelResponse);
  
  // Unequip angel
  rpc UnequipAngel(UnequipAngelRequest) returns (UnequipAngelResponse);
  
  // Upgrade star level
  rpc UpgradeStarLevel(UpgradeStarLevelRequest) returns (UpgradeStarLevelResponse);
  
  // Upgrade skill
  rpc UpgradeSkill(UpgradeSkillRequest) returns (UpgradeSkillResponse);
  
  // Evolve angel
  rpc EvolveAngel(EvolveAngelRequest) returns (EvolveAngelResponse);

  // Level up angel appearance / skin
  rpc AppearanceLevelUp(AppearanceLevelUpRequest) returns (AppearanceLevelUpResponse);

  // Use / equip an appearance skin for angel
  rpc UseAppearance(UseAppearanceRequest) returns (UseAppearanceResponse);
}

// Angel data message
message AngelData {
  int64 id = 1;
  int64 user_id = 2;
  int32 angel_index = 3;
  int32 angel_id = 4;
  int32 level = 5;
  int32 grade = 6;
  int64 exp = 7;
  bool is_active = 8;
  bool is_equipped = 9;
  int32 star_level = 10;
  
  // Skills
  int32 skill1_id = 11;
  int32 skill1_level = 12;
  int32 skill2_id = 13;
  int32 skill2_level = 14;
  int32 skill3_id = 15;
  int32 skill3_level = 16;
  int32 skill4_id = 17;
  int32 skill4_level = 18;
  
  int32 appearance_id = 19;
  int32 evolution_stage = 20;
  int64 blessing_points = 21;
  int64 combat_power = 22;
  
  int64 created_at = 23;
  int64 updated_at = 24;
  int32 appearance_level = 25;
}

// Get user angels
message GetUserAngelsRequest {
  int64 user_id = 1;
}

message GetUserAngelsResponse {
  common.ResponseStatus status = 1;
  repeated AngelData angels = 2;
}

// Get angel
message GetAngelRequest {
  int64 user_id = 1;
  int32 angel_index = 2;
}

message GetAngelResponse {
  common.ResponseStatus status = 1;
  AngelData angel = 2;
}

// Unlock angel
message UnlockAngelRequest {
  int64 user_id = 1;
  int32 angel_id = 2;
}

message UnlockAngelResponse {
  common.ResponseStatus status = 1;
  AngelData angel = 2;
}

// Level up angel
message LevelUpAngelRequest {
  int64 user_id = 1;
  int32 angel_index = 2;
}

message LevelUpAngelResponse {
  common.ResponseStatus status = 1;
  AngelData angel = 2;
  int64 exp_gained = 3;
}

// Grade up angel
message GradeUpAngelRequest {
  int64 user_id = 1;
  int32 angel_index = 2;
}

message GradeUpAngelResponse {
  common.ResponseStatus status = 1;
  AngelData angel = 2;
}

// Equip angel
message EquipAngelRequest {
  int64 user_id = 1;
  int32 angel_index = 2;
}

message EquipAngelResponse {
  common.ResponseStatus status = 1;
  string message = 2;
}

// Unequip angel
message UnequipAngelRequest {
  int64 user_id = 1;
}

message UnequipAngelResponse {
  common.ResponseStatus status = 1;
  string message = 2;
}

// Upgrade star level
message UpgradeStarLevelRequest {
  int64 user_id = 1;
  int32 angel_index = 2;
}

message UpgradeStarLevelResponse {
  common.ResponseStatus status = 1;
  AngelData angel = 2;
}

// Upgrade skill
message UpgradeSkillRequest {
  int64 user_id = 1;
  int32 angel_index = 2;
  int32 skill_slot = 3; // 1-4
}

message UpgradeSkillResponse {
  common.ResponseStatus status = 1;
  AngelData angel = 2;
  int32 new_skill_level = 3;
}

// Evolve angel
message EvolveAngelRequest {
  int64 user_id = 1;
  int32 angel_index = 2;
}

message EvolveAngelResponse {
  common.ResponseStatus status = 1;
  AngelData angel = 2;
  int32 new_evolution_stage = 3;
}

// Level up appearance
message AppearanceLevelUpRequest {
  int64 user_id = 1;
  int32 angel_index = 2;
  int32 target_level = 3;
}

message AppearanceLevelUpResponse {
  common.ResponseStatus status = 1;
  AngelData angel = 2;
  int32 new_appearance_level = 3;
}

// Use / equip appearance
message UseAppearanceRequest {
  int64 user_id = 1;
  int32 angel_index = 2;
  int32 appearance_id = 3;
}

message UseAppearanceResponse {
  common.ResponseStatus status = 1;
  string message = 2;
}
