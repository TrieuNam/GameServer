syntax = "proto3";

package gem;

option java_package = "org.SouthMillion.proto.gem";
option java_outer_classname = "GemServiceProto";
option java_multiple_files = true;

import "common.proto";

service GemService {
  rpc GetGemInfo(GetGemInfoRequest) returns (GemInfoResponse);
  rpc Inlay(InlayRequest) returns (GenericResponse);
  rpc Remove(RemoveRequest) returns (GenericResponse);
  rpc Compose(ComposeRequest) returns (GenericResponse);
  rpc UpgradeAll(UpgradeAllRequest) returns (GenericResponse);
  rpc Buy(BuyRequest) returns (GenericResponse);
}

message GetGemInfoRequest {
  int64 role_id = 1;
}

message InlayRequest {
  int64 role_id = 1;
  int32 gem_id = 2;
  int32 slot_type = 3;
}

message RemoveRequest {
  int64 role_id = 1;
  int32 gem_id = 2;
}

message ComposeRequest {
  int64 role_id = 1;
  repeated int32 source_gem_ids = 2;
}

message UpgradeAllRequest {
  int64 role_id = 1;
  repeated int32 gem_ids = 2;
}

message BuyRequest {
  int64 role_id = 1;
  repeated int32 gem_ids = 2;
}

message GemData {
  int64 id = 1;
  int64 role_id = 2;
  int32 gem_id = 3;
  int32 level = 4;
  int32 count = 5;
  bool is_inlaid = 6;
  int32 slot_type = 7;
}

message GemInfoResponse {
  bool success = 1;
  string message = 2;
  int32 drawing_id = 3;
  repeated GemData gems = 4;
}

message GenericResponse {
  bool success = 1;
  string message = 2;
  string data_json = 3;
}
