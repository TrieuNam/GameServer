syntax = "proto3";

package scroll;

option java_package = "org.SouthMillion.proto.scroll";
option java_outer_classname = "ScrollServiceProto";
option java_multiple_files = true;

import "common.proto";

// Scroll drawing gRPC Service Definition
service ScrollService {
  // Get scroll metadata for a role
  rpc GetMeta(GetMetaRequest) returns (ScrollMetaResponse);

  // Get scroll item list for a role
  rpc GetList(GetListRequest) returns (GetListResponse);

  // Draw scrolls
  rpc Draw(DrawRequest) returns (GenericResponse);
}

// Request Messages

message GetMetaRequest {
  int64 role_id = 1;
}

message GetListRequest {
  int64 role_id = 1;
}

message DrawRequest {
  int64 role_id = 1;
  int32 count = 2;
}

// Response Messages

message ScrollMetaData {
  int64 id = 1;
  int64 role_id = 2;
  int32 free_num = 3;
  int32 bao_di_num = 4;
}

message ScrollItemData {
  int64 id = 1;
  int64 role_id = 2;
  int32 scroll_index = 3;
  int32 item_id = 4;
  int32 level = 5;
  int32 wear_mark = 6;
  int32 param = 7;
}

message ScrollMetaResponse {
  bool success = 1;
  string message = 2;
  ScrollMetaData meta = 3;
}

message GetListResponse {
  bool success = 1;
  string message = 2;
  repeated ScrollItemData items = 3;
}

message GenericResponse {
  bool success = 1;
  string message = 2;
  string data_json = 3;  // JSON serialized result
}
