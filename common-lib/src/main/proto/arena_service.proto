// Arena Service gRPC definitions
syntax = "proto3";

package org.SouthMillion.grpc.arena;

import "common.proto";

option java_multiple_files = true;
option java_outer_classname = "ArenaServiceProto";
option java_package = "org.SouthMillion.grpc.arena";

// Arena Service Definition
service ArenaService {
  // Get player's arena info (rating, rank, stats)
  rpc GetArenaInfo(GetArenaInfoRequest) returns (ArenaInfoResponse);
  
  // Get matchmaking opponents list
  rpc GetOpponents(GetOpponentsRequest) returns (OpponentsResponse);
  
  // Start arena battle (challenge opponent)
  rpc StartBattle(StartBattleRequest) returns (BattleResultResponse);
  
  // Get arena rankings/leaderboard
  rpc GetRankings(GetRankingsRequest) returns (RankingsResponse);
  
  // Claim arena rewards (daily/weekly)
  rpc ClaimRewards(ClaimRewardsRequest) returns (ClaimRewardsResponse);
  
  // Get battle history
  rpc GetBattleHistory(GetBattleHistoryRequest) returns (BattleHistoryResponse);
  
  // Buy challenge count (if limited per day)
  rpc BuyChallengeCount(BuyChallengeCountRequest) returns (BuyChallengeCountResponse);
}

// Request Messages

message GetArenaInfoRequest {
  int64 role_id = 1;
}

message GetOpponentsRequest {
  int64 role_id = 1;
  int32 count = 2; // Number of opponents to return (default 5)
}

message StartBattleRequest {
  int64 role_id = 1;
  int64 opponent_id = 2;
  bool is_revenge = 3; // Revenge battle flag
}

message GetRankingsRequest {
  int32 season = 1;
  int32 page = 2;
  int32 size = 3;
}

message ClaimRewardsRequest {
  int64 role_id = 1;
  string reward_type = 2; // "DAILY", "WEEKLY", "SEASON"
}

message GetBattleHistoryRequest {
  int64 role_id = 1;
  int32 page = 2;
  int32 size = 3;
}

message BuyChallengeCountRequest {
  int64 role_id = 1;
  int32 count = 2; // Number of challenges to buy
}

// Response Messages

message ArenaInfoResponse {
  ArenaPlayer player = 1;
  int32 challenges_remaining = 2;
  int32 max_challenges = 3;
  int64 next_reset_time = 4; // Unix timestamp
  common.ResponseStatus status = 5;
}

message OpponentsResponse {
  repeated ArenaPlayer opponents = 1;
  common.ResponseStatus status = 2;
}

message BattleResultResponse {
  bool victory = 1;
  int32 rating_change = 2;
  int32 new_rating = 3;
  int32 new_rank = 4;
  repeated Reward rewards = 5;
  BattleDetails battle_details = 6;
  common.ResponseStatus status = 7;
}

message RankingsResponse {
  repeated RankingEntry rankings = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 size = 4;
  common.ResponseStatus status = 5;
}

message ClaimRewardsResponse {
  repeated Reward rewards = 1;
  string message = 2;
  common.ResponseStatus status = 3;
}

message BattleHistoryResponse {
  repeated BattleRecord battles = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 size = 4;
  common.ResponseStatus status = 5;
}

message BuyChallengeCountResponse {
  bool success = 1;
  int32 new_challenge_count = 2;
  int32 cost = 3; // Cost paid
  string message = 4;
  common.ResponseStatus status = 5;
}

// Data Models

message ArenaPlayer {
  int64 role_id = 1;
  string role_name = 2;
  int32 rating = 3;
  int32 rank = 4;
  int32 level = 5;
  int32 power = 6; // Combat power
  int32 wins = 7;
  int32 losses = 8;
  int32 consecutive_wins = 9;
  int32 season = 10;
  int32 win_rate = 11; // Percentage (0-100)
}

message RankingEntry {
  int32 rank = 1;
  ArenaPlayer player = 2;
  int32 rating = 3;
  int32 wins = 4;
  int32 losses = 5;
}

message BattleDetails {
  int64 attacker_id = 1;
  int64 defender_id = 2;
  string attacker_name = 3;
  string defender_name = 4;
  int32 attacker_rating_before = 5;
  int32 attacker_rating_after = 6;
  int32 defender_rating_before = 7;
  int32 defender_rating_after = 8;
  int32 battle_duration = 9; // Seconds
  bool is_consecutive_win = 10;
  int32 consecutive_win_bonus = 11;
}

message BattleRecord {
  int64 battle_id = 1;
  int64 attacker_id = 2;
  int64 defender_id = 3;
  string attacker_name = 4;
  string defender_name = 5;
  bool is_victory = 6; // For the requesting player
  int32 rating_change = 7;
  int64 battle_time = 8; // Unix timestamp
  int32 season = 9;
}

message Reward {
  int32 item_id = 1;
  int32 amount = 2;
  string item_name = 3;
}
