syntax = "proto3";

package com.southMillion.proto.artifact;

import "common.proto";

option java_multiple_files = true;
option java_package = "org.SouthMillion.proto.artifact";
option java_outer_classname = "ArtifactServiceProto";

service ArtifactGrpcService {
  rpc GetAllArtifacts(GetAllArtifactsRequest) returns (GetAllArtifactsResponse);
  rpc GetArtifact(GetArtifactRequest) returns (GetArtifactResponse);
  rpc UnlockArtifact(UnlockArtifactRequest) returns (UnlockArtifactResponse);
  rpc LevelUpArtifact(LevelUpArtifactRequest) returns (LevelUpArtifactResponse);
  rpc GradeUpArtifact(GradeUpArtifactRequest) returns (GradeUpArtifactResponse);
  rpc EquipArtifact(EquipArtifactRequest) returns (EquipArtifactResponse);
  rpc UnequipArtifact(UnequipArtifactRequest) returns (UnequipArtifactResponse);
  rpc RefineArtifact(RefineArtifactRequest) returns (RefineArtifactResponse);
  rpc AwakenArtifact(AwakenArtifactRequest) returns (AwakenArtifactResponse);
  rpc UpgradeArtifactSkill(UpgradeArtifactSkillRequest) returns (UpgradeArtifactSkillResponse);
  rpc DrawArtifacts(DrawArtifactsRequest) returns (DrawArtifactsResponse);
}

message ArtifactData {
  int64 id = 1;
  int64 user_id = 2;
  int32 artifact_index = 3;
  int32 artifact_id = 4;
  int32 level = 5;
  int32 grade = 6;
  int64 exp = 7;
  bool is_active = 8;
  bool is_equipped = 9;
  int32 refinement_level = 10;
  int32 awakening_stage = 11;
  int64 soul_power = 12;
  int64 divine_essence = 13;
  int32 blessing_level = 14;
  int64 combat_power = 15;
  int64 created_at = 16;
  int64 updated_at = 17;
}

message GetAllArtifactsRequest {
  int64 user_id = 1;
}

message GetAllArtifactsResponse {
  common.ResponseStatus status = 1;
  repeated ArtifactData artifacts = 2;
}

message GetArtifactRequest {
  int64 user_id = 1;
  int32 artifact_index = 2;
}

message GetArtifactResponse {
  common.ResponseStatus status = 1;
  ArtifactData artifact = 2;
}

message UnlockArtifactRequest {
  int64 user_id = 1;
  int32 artifact_id = 2;
}

message UnlockArtifactResponse {
  common.ResponseStatus status = 1;
  ArtifactData artifact = 2;
}

message LevelUpArtifactRequest {
  int64 user_id = 1;
  int32 artifact_index = 2;
}

message LevelUpArtifactResponse {
  common.ResponseStatus status = 1;
  ArtifactData artifact = 2;
  int64 exp_gained = 3;
}

message GradeUpArtifactRequest {
  int64 user_id = 1;
  int32 artifact_index = 2;
}

message GradeUpArtifactResponse {
  common.ResponseStatus status = 1;
  ArtifactData artifact = 2;
}

message EquipArtifactRequest {
  int64 user_id = 1;
  int32 artifact_index = 2;
}

message EquipArtifactResponse {
  common.ResponseStatus status = 1;
  string message = 2;
}

message UnequipArtifactRequest {
  int64 user_id = 1;
}

message UnequipArtifactResponse {
  common.ResponseStatus status = 1;
  string message = 2;
}

message RefineArtifactRequest {
  int64 user_id = 1;
  int32 artifact_index = 2;
}

message RefineArtifactResponse {
  common.ResponseStatus status = 1;
  ArtifactData artifact = 2;
}

message AwakenArtifactRequest {
  int64 user_id = 1;
  int32 artifact_index = 2;
}

message AwakenArtifactResponse {
  common.ResponseStatus status = 1;
  ArtifactData artifact = 2;
  int32 new_awakening_stage = 3;
}

message UpgradeArtifactSkillRequest {
  int64 user_id = 1;
  int32 artifact_index = 2;
  int32 skill_index = 3;
}

message UpgradeArtifactSkillResponse {
  common.ResponseStatus status = 1;
  ArtifactData artifact = 2;
  int32 skill_index = 3;
  int32 new_skill_level = 4;
}

message DrawArtifactsRequest {
  int64 user_id = 1;
  int32 draw_type = 2;
}

message DrawArtifactResult {
  int32 artifact_id = 1;
  int32 quality = 2;
  bool is_guaranteed = 3;
}

message DrawArtifactsResponse {
  common.ResponseStatus status = 1;
  repeated DrawArtifactResult results = 2;
}
