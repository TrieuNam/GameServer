syntax = "proto3";

package pagoda;

option java_package = "org.SouthMillion.proto.pagoda";
option java_outer_classname = "PagodaServiceProto";
option java_multiple_files = true;

import "common.proto";

// Pagoda (Trial Tower + Demon-Lock Tower) gRPC Service Definition
service PagodaService {
  // Get ShiLian (Trial Tower) progress
  rpc GetShiLian(GetShiLianRequest) returns (ShiLianResponse);

  // Challenge ShiLian level
  rpc ChallengeShiLian(ChallengeShiLianRequest) returns (ShiLianResponse);

  // Claim ShiLian reward
  rpc ClaimShiLian(ClaimShiLianRequest) returns (BoolResponse);

  // Get GuMo (Demon-Lock Tower) state
  rpc GetGuMo(GetGuMoRequest) returns (GenericResponse);

  // Challenge GuMo layer
  rpc ChallengeGuMo(ChallengeGuMoRequest) returns (GenericResponse);

  // Claim GuMo box reward
  rpc ClaimGuMo(ClaimGuMoRequest) returns (BoolResponse);
}

// Request Messages

message GetShiLianRequest {
  int64 role_id = 1;
}

message ChallengeShiLianRequest {
  int64 role_id = 1;
  int32 p1 = 2;
}

message ClaimShiLianRequest {
  int64 role_id = 1;
  int32 p1 = 2;
}

message GetGuMoRequest {
  int64 role_id = 1;
}

message ChallengeGuMoRequest {
  int64 role_id = 1;
  int32 layer_id = 2;
}

message ClaimGuMoRequest {
  int64 role_id = 1;
  int32 layer_id = 2;
}

// Response Messages

message ShiLianData {
  int64 id = 1;
  int64 role_id = 2;
  int32 pass_level = 3;
  int32 best_level = 4;
  int32 use_item = 5;
  int32 random_id = 6;
  int64 season_end_time = 7;
}

message ShiLianResponse {
  bool success = 1;
  string message = 2;
  ShiLianData shilian = 3;
}

message BoolResponse {
  bool success = 1;
  string message = 2;
  bool result = 3;
}

message GenericResponse {
  bool success = 1;
  string message = 2;
  string data_json = 3;  // JSON serialized result
}
