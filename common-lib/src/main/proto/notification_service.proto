syntax = "proto3";

package notification;

option java_package = "org.SouthMillion.proto.notification";
option java_outer_classname = "NotificationProto";

import "common.proto";

service NotificationService {
  rpc SendNotification(SendNotificationRequest) returns (common.ResponseStatus);
  rpc GetPlayerNotifications(GetPlayerNotificationsRequest) returns (NotificationsResponse);
  rpc GetUnreadNotifications(GetUnreadNotificationsRequest) returns (NotificationsResponse);
  rpc MarkAsRead(MarkAsReadRequest) returns (common.ResponseStatus);
}

message SendNotificationRequest {
  int64 player_id = 1;
  string type = 2; // PUSH, EMAIL, SMS, IN_GAME
  string title = 3;
  string message = 4;
  string data = 5; // JSON payload
}

message GetPlayerNotificationsRequest {
  int64 player_id = 1;
  int32 limit = 2;
}

message GetUnreadNotificationsRequest {
  int64 player_id = 1;
}

message NotificationsResponse {
  repeated Notification notifications = 1;
}

message Notification {
  int64 id = 1;
  int64 player_id = 2;
  string type = 3;
  string title = 4;
  string message = 5;
  string data = 6;
  string status = 7; // PENDING, SENT, FAILED, READ
  string error_message = 8;
  int64 sent_at = 9;
  int64 read_at = 10;
  int64 created_at = 11;
}

message MarkAsReadRequest {
  int64 notification_id = 1;
}
