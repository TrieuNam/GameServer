server:
  port: 8300
  shutdown: graceful

# gRPC Server Configuration
grpc:
  server:
    port: 9300
    address: 0.0.0.0
    max-inbound-message-size: 4MB
    keep-alive-time: 5m
    keep-alive-timeout: 20s

spring:
  profiles:
    active: local  # Default to local profile
  application:
    name: trial-service
  
  threads:
    virtual:
      enabled: true
  
  # Kafka configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: 1
      retries: 3
      batch-size: 16384
      linger-ms: 10
    template:
      default-topic: trial-events
  
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:33073/game_trial?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:tpnam}
    password: ${DB_PASSWORD:121831}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: INFO
    com.game.trial: DEBUG
    org.hibernate.SQL: DEBUG
