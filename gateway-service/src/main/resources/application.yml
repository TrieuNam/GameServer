server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:
            - id: game-ws
              uri: lb:ws://websocket-server
              predicates:
                - Path=/webSocket-server/ws/game
              filters:
                - StripPrefix=1
                - RemoveRequestHeader=Sec-WebSocket-Protocol

          # tăng WS frame nếu cần
          httpclient:
            websocket:
              max-frame-payload-length: 1048576

eureka:
  instance:
    prefer-ip-address: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

app:
  auth:
    whitelist:
      - /session-service/api/session/login
      - /user-service/api/user/register-or-login
      - /session-service/internal/session/introspect
      - /session-service/api/session/heartbeat
      - /session-service/api/session/timesync
      - /config-service/config/dev-query-h02.json
      - /config-service/api/c2s/fetch_privacy_notice
      - /config-service/config/internal/reload
      - /config-service/config/dev-query-h02.json/override
      - /report-service/api/report
      - /config-service/config/gameworld/logicconfig/roleexp
      - /config-service/config/gameworld/logicconfig/role_name
      - /config-service/config/gameworld/logicconfig/bag_cfg
      - /config-service/config/gameworld/globalconfig/keyconfig
      - /config-service/config/gameworld/globalconfig/otherconfig
    sessionServiceId: session-service
    introspectPath: /internal/session/introspect
    introspectMethod: POST
    ws:
      queryTokenKey: token
      headerTokenKeys:
        - Authorization
        - Sec-WebSocket-Protocol
