server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          # === Áp dụng cho mọi route (fix trùng header CORS) ===
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Expose-Headers, RETAIN_FIRST

          # === Route WebSocket ===
          routes:
            - id: game-ws
              uri: lb:ws://websocket-server
              predicates:
                - Path=/websocket-server/**
              filters:
                - StripPrefix=1

          # === Tự động tạo route theo Eureka ===
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          # === CORS toàn cục tại Gateway ===
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:7456"
                  - "http://127.0.0.1:7456"
                allowedMethods: [ GET, POST, PUT, DELETE, OPTIONS ]
                allowedHeaders: [ "*" ]
                allowCredentials: true
                maxAge: 3600

          # === Netty client (GW -> downstream): tăng frame WS ===
          httpclient:
            websocket:
              max-frame-payload-length: 1048576

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

app:
  auth:
    whitelist:
      - /session-service/api/session/login
      - /session-service/api/session/heartbeat
      - /session-service/api/session/timesync
      - /config-service/api/config/file
      - /config-service/api/config/file/**
      - /config-service/internal/reload
      - /report-service/api/report/**
      - /websocket-server/**
    sessionServiceId: session-service
    introspectPath: /internal/session/introspect
    introspectMethod: POST
    ws:
      queryTokenKey: token
      headerTokenKeys:
        - Authorization
        - Sec-WebSocket-Protocol
