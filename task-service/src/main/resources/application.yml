server:
  port: 8097

spring:
  application:
    name: task-service
  profiles:
    active: local

  threads:
    virtual:
      enabled: true

  cache:
    type: redis
    cache-names: taskItemMeta
    redis:
      time-to-live: 600000  # 10 minutes
      cache-null-values: false

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:33074/game_task?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    connect-retries: 10
    connect-retries-interval: 5

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    consumer:
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.use.type.headers: false
        spring.json.value.default.type: org.SouthMillion.dto.event.task.TaskProgressEvent
        spring.json.trusted.packages: "*"

management:
  endpoints:
    web.exposure.include: health,info,metrics,env,threaddump,loggers
  endpoint.health.probes.enabled: true

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

task:
  config:
    path: ${TASK_CONFIG_PATH:gameworld/logicconfig/task_cfg.json}
    refresh-initial-delay-ms: ${TASK_CONFIG_REFRESH_INITIAL_DELAY_MS:60000}
    refresh-interval-ms: ${TASK_CONFIG_REFRESH_INTERVAL_MS:60000}
  progress-event:
    cleanup-enabled: ${TASK_PROGRESS_EVENT_CLEANUP_ENABLED:true}
    retention-days: ${TASK_PROGRESS_EVENT_RETENTION_DAYS:30}
    cleanup-initial-delay-ms: ${TASK_PROGRESS_EVENT_CLEANUP_INITIAL_DELAY_MS:300000}
    cleanup-interval-ms: ${TASK_PROGRESS_EVENT_CLEANUP_INTERVAL_MS:3600000}

