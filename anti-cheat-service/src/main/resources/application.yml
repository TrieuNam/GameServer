server:
  port: 8590

spring:
  profiles:
    active: local  # Default to local profile
  application:
    name: anti-cheat-service
  
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:33093/game_anticheat?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:tpnam}
    password: ${DB_PASSWORD:121831}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      database: 9
      timeout: 60000
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: anti-cheat-service-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

# Anti-Cheat Configuration
anticheat:
  detection:
    speed-hack-threshold: 1.5  # 150% of normal speed
    teleport-distance: 100.0   # Max distance in one update
    damage-hack-threshold: 2.0 # 200% of normal damage
    resource-gain-threshold: 10.0 # 10x normal resource gain
    
  analysis:
    behavior-window: 300       # 5 minutes in seconds
    suspicious-score-threshold: 70
    auto-ban-score: 90
    
  monitoring:
    check-interval: 60000      # 1 minute
    cleanup-days: 30           # Keep data for 30 days

logging:
  level:
    com.southMillion: DEBUG
    org.springframework.kafka: INFO
    org.hibernate: INFO
