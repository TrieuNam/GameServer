server:
  port: 8220

spring:
  profiles:
    default: local
  application:
    name: item-service
  main:
    keep-alive: true

# nếu dùng eureka:
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Cấu hình gọi config-service
item:
  config:
    # Local default: config-service runs on localhost:8888
    # Override with ITEM_CONFIG_BASE_URL in container/prod environments
    base-url: ${ITEM_CONFIG_BASE_URL:http://localhost:8888}
    # Item metadata thực tế nằm trong các file gộp dưới gameworld/item/*.json
    item-catalog-paths:
      - gameworld/item/equipment.json
      - gameworld/item/other.json
      - gameworld/item/expense.json
      - gameworld/item/gift.json
      - gameworld/item/debris.json
      - gameworld/item/model_item.json
      - gameworld/item/gemstone.json
      - gameworld/item/gemstone_drawing.json
      - gameworld/item/scroll_item.json
      - gameworld/item/title_item.json
      - gameworld/item/block_item.json
      - gameworld/item/harness_item.json
      - gameworld/item/pet_item.json
      - gameworld/item/pet_weapon_item.json
      - gameworld/item/inscription_item.json
      - gameworld/item/wabao_cfg.json
    cache-ttl-seconds: 300
    # có thể thêm size limit nếu dùng caffeine
    cache-max-size: 10000
    # Redis read-through cache cho item meta
    meta-redis-ttl-seconds: 21600
    meta-redis-key-prefix: "item:meta:"

feign:
  okhttp:
    enabled: false
  httpclient:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    # Add timeout for Redis health check to avoid long waiting times
    redis:
      # Timeout in milliseconds
      response-timeout: 3000ms