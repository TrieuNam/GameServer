server:
  port: 8087

spring:
  application:
    name: item-service
  main:
    keep-alive: true

# nếu dùng eureka:
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

# Cấu hình gọi config-service
item:
  config:
    # base-url có thể là http://config-service:8080 (qua eureka/gateway)
    base-url: http://config-service:8080
    # Đường lấy 1 file item theo itemId (bạn chỉnh cho khớp config-service)
    item-path-template: /api/config/file?path=config/gameworld/item/%d.json
    cache-ttl-seconds: 300
    # có thể thêm size limit nếu dùng caffeine
    cache-max-size: 10000

feign:
  okhttp:
    enabled: false
  httpclient:
    enabled: true