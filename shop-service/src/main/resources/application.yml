server:
  port: 8260

grpc:
  server:
    port: 9260  # gRPC port — planned for future webSocket-server integration

spring:
  application:
    name: shop-service
  profiles:
    active: local

  threads:
    virtual:
      enabled: true

  cache:
    type: redis
    cache-names: shopItemMeta
    redis:
      time-to-live: 600000  # 10 minutes
      cache-null-values: false

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:33069/game_shop?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    connect-retries: 10
    connect-retries-interval: 5

app:
  config:
    cloth: gameworld/logicconfig/cloth_shop.json
    common: gameworld/logicconfig/shop_cfg.json
    shenmi: gameworld/logicconfig/shop_shenmi.json

management:
  endpoints:
    web.exposure.include: health,info,metrics,env,threaddump,loggers
  endpoint.health.probes.enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
