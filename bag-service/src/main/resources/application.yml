server:
  port: 8230

grpc:
  server:
    port: 9230  # gRPC port — webSocket-server connects here via BagGrpcClient

spring:
  application:
    name: bag-service

  threads:
    virtual:
      enabled: true   # Java 21 Virtual Threads

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:33067/game_bag?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:tpnam}
    password: ${DB_PASSWORD:121831}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    connect-retries: 10
    connect-retries-interval: 5

  cache:
    type: redis

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

management:
  endpoints:
    web.exposure.include: health,info,metrics,env,threaddump,loggers
  endpoint.health.probes.enabled: true

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
