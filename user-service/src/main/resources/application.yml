server:
  port: 8082

spring:
  application:
    name: user-service
  threads:
    virtual:
      enabled: true   # ✅ Java 21 virtual threads
  datasource:
    url: jdbc:mysql://localhost:3308/userdb
    username: tpnam
    password: 121831
  jpa:
    hibernate:
      ddl-auto: validate      # ✅ dùng Flyway, không auto-update schema
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.default_batch_fetch_size: 50
      hibernate.jdbc.batch_size: 25

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379
      # password: <nếu có>

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
