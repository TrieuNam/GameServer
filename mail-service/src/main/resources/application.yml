server:
  port: 8470

spring:
  profiles:
    active: local  # Default to local profile (root/root). Use -Dspring.profiles.active=prod for production
  application:
    name: mail-service
  
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:33086/game_mail?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:tpnam}
    password: ${DB_PASSWORD:121831}
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 6
      timeout: 5000ms

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    com.lhp.game.mail: DEBUG
