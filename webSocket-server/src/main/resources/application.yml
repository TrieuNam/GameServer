server:
  port: 8094

spring:
  application:
    name: websocket-server   # rất quan trọng: gateway route dùng lb:ws://websocket-server
  main:
    web-application-type: reactive
  cloud:
    loadbalancer:
      retry:
        # Tắt retry của RetryableFeignBlockingLoadBalancerClient
        # Mặc định retry 3 lần → mỗi service down tốn 3-6 giây block login
        enabled: false
  # ── Redis (session registry) ───────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        # DÙNG HEADER ALIAS:
        spring.json.type.mapping: >
          bagChanged:org.SouthMillion.dto.event.bag.BagChangedEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true

eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5      # heartbeat mỗi 5s (default 30s)
    lease-expiration-duration-in-seconds: 15  # hết hạn sau 15s nếu không heartbeat
  client:
    fetchRegistry: true
    registerWithEureka: true
    registry-fetch-interval-seconds: 5        # refresh danh sách service mỗi 5s (default 30s)
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info

# optional: cấu hình feign timeouts
feign:
  client:
    config:
      default:
        loggerLevel: FULL   # log URL, headers, body request/response
        connectTimeout: 2000   # 2s (increased from 1s) — more lenient for services under load
        readTimeout: 5000      # 5s (increased from 3s) — allow more time for complex queries
  okhttp:
    enabled: true           # nếu dùng OkHttp (khuyên dùng)


app:
  bootstrap:
    readiness:
      enabled: true
      required-services: role-service,world-service,bag-service,config-service,drop-service
      check-health-endpoints: true
      health-timeout-ms: 1500
      health-path: /actuator/health
      max-attempts: 8
      initial-delay-ms: 400
      max-delay-ms: 3000
  server:
    startEpoch: 0        # epoch giây lần đầu mở server (để tính open_days)
    combineEpoch: 0      # epoch giây lần combine server (nếu có)
  kafka:
    bag-grant-topic: gameh5.bag.grant
    bag-changed-topic: gameh5.bag.changed
    task-progress-topic: task.progress.update
    concurrency: 3
  task-progress:
    conditions:
      # Keep only verified defaults here. Add guild/trial condition ids after task-cfg mapping is approved.
      arena-win: 0
      # Disabled until condition-id table is frozen; previous values could progress wrong legacy tasks.
      guild-join: 0
      guild-create: 0
      trial-complete: 0
      pet-activate: 0
      pet-upgrade: 0
      pet-evolve: 0
      mount-level-up: 0
      mount-grade-up: 0
      mount-wear: 0
      mount-decompose: 0
      skill-learn: 0
      skill-one-key-level-up: 0
      crafting-start: 0
      crafting-claim: 0
      gem-inlay: 32
      gem-compose: 0
      gem-upgrade: 0
      gem-buy: 0
      shenqi-activate: 0
      shenqi-upgrade: 0
      shenqi-evolve: 0
      shenqi-refine: 0
      shenqi-draw: 57
      angel-level-up: 0
      angel-grade-up: 0
      angel-equip: 0
      angel-appearance-level-up: 0
      rune-level-up: 0
      rune-upgrade-quality: 0
      rune-equip: 61
      escort-start: 0
      escort-complete: 29
      escort-rob: 0
      territory-fetch-reward: 59
      territory-level-up: 0
      pagoda-shilian-challenge: 0
      pagoda-shilian-claim: 0
      pagoda-gumo-challenge: 40
      pagoda-gumo-claim: 0
      lingzhu-challenge: 60
      lingzhu-sweep: 0
      shizhuang-equip: 0
      shizhuang-fumo: 56
      block-inlay: 71
      block-remove: 0
      block-compose: 73
      formation-level-up: 27
  redis-preload:
    enabled: true
    ttl-hours: 24
    allow-remote-fallback-on-miss: false
    fetch-attempts: 3
    fetch-backoff-ms: 1000
    p1-async: true
    p1-timeout-ms: 15000
    # P0: Critical configs needed immediately during login bootstrap (loaded synchronously)
    p0-paths:
      - gameworld/logicconfig/task_cfg.json        # Task definitions & conditions
      - gameworld/logicconfig/roleexp.json         # Level-up exp requirements
      - gameworld/logicconfig/role_name.json       # Random name pool
      - gameworld/skill/single_skill.json          # Active skill configs
      - gameworld/skill/passive_skill.json         # Talent/passive skill configs
      - gameworld/item/equipment.json              # Equipment templates (stats)
    # P1: Important configs loaded asynchronously after P0 (can tolerate slight delay)
    p1-paths:
      - gameworld/item/other.json                  # Other item definitions
      - gameworld/item/expense.json                # Consumable item definitions
      - gameworld/item/gift.json                   # Gift box configs
      - gameworld/logicconfig/shop_cfg.json        # Common shop items
      - gameworld/logicconfig/shop_shenmi.json     # Mystery shop configs
      - gameworld/logicconfig/cloth_shop.json      # Fashion shop configs
      - gameworld/logicconfig/model_clothes.json   # Fashion master configs
      - gameworld/logicconfig/angel.json           # Angel configs
      - gameworld/logicconfig/unpack.json          # Box opening configs (random rewards)
      - gameworld/logicconfig/kaixiangdaji.json    # Lucky box opening configs
  login-snapshot:
    enabled: true
    rollout-percent: 100
    ttl-hours: 24
    schema-version: v1
    module-version-token: bootstrap-v1

# Cross-server configuration
cross-server:
  enabled: false  # Set to true in production to enable cross-server features
  min-level: 50   # Minimum player level required for cross-server transfer
  target-server-id: cross-server-1  # Target cross-server identifier
  origin-server-id: server-1        # This server's identifier
  gateway:
    host: localhost  # Cross-server gateway hostname
    port: 9000       # Cross-server gateway port
  session:
    ttl-minutes: 30  # Session expiry time (30 minutes default)
    secret: ${CROSS_SERVER_SECRET:change-me-in-production-use-minimum-32-chars}  # HMAC secret for session keys

