logging:
  level:
    root: INFO
    com.SouthMillion: DEBUG
    feign: DEBUG
    feign.Logger: DEBUG
    org.springframework.cloud.openfeign: DEBUG
    com.SouthMillion.role_service.feign: DEBUG
    com.SouthMillion.bag_service.feign: DEBUG
    com.SouthMillion.equip_service.feign: DEBUG
    com.SouthMillion.wallet_service.feign: DEBUG
    com.SouthMillion.box_service.feign: DEBUG
    # ── gRPC reconnect-backoff spam suppression ────────────────────────
    # Khi service down, gRPC tự retry name-resolution mỗi 1-120s (exponential backoff).
    # Mỗi lần retry tạo 2 log dòng từ các class bên dưới — vô tác dụng vì call-level
    # errors đã được log bởi từng GrpcClient (com.SouthMillion.*).
    # OFF: hoàn toàn tắt — không mất thông tin do GrpcClient log riêng rồi.
    net.devh.boot.grpc.client.nameresolver.DiscoveryClientNameResolver: OFF
    io.grpc.internal.ManagedChannelImpl: OFF
    # ── Feign load balancer WARN suppression ────────────────────────────
    # Mỗi Feign call tới service down tạo 2 dòng WARN bên dưới (mỗi call, không lặp).
    # Handler (PagodaHandler, MailHandler...) đã log ERROR riêng → không mất thông tin.
    org.springframework.cloud.loadbalancer.core.RoundRobinLoadBalancer: ERROR
    org.springframework.cloud.openfeign.loadbalancer.FeignBlockingLoadBalancerClient: ERROR

# ── Resilience4j Circuit Breaker ────────────────────────────────────────
# Khi 1 downstream service down: mở circuit → fail nhanh thay vì đợi timeout
# Ngăn 1 service chết kéo chết toàn bộ websocket-server
resilience4j:
  circuitbreaker:
    configs:
      default:
        minimumNumberOfCalls: 10           # cần ít nhất 10 call để đánh giá
        failureRateThreshold: 50           # > 50% lỗi → mở circuit
        waitDurationInOpenState: 10s       # chờ 10s rồi thử HALF_OPEN
        permittedNumberOfCallsInHalfOpenState: 5
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - feign.FeignException
          - io.grpc.StatusRuntimeException
        registerHealthIndicator: true
    instances:
      world-service:
        baseConfig: default
      bag-service:
        baseConfig: default
      shop-service:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 6s
        cancelRunningFuture: true
    instances:
      world-service:
        baseConfig: default

