server:
  port: 8410

# gRPC Server Configuration
grpc:
  server:
    port: 9410
    address: 0.0.0.0
    max-inbound-message-size: 4194304  # 4MB
    keep-alive-time: 30s
    keep-alive-timeout: 10s
    permit-keep-alive-without-calls: true
    max-connection-idle: 5m
    max-connection-age: 30m
  
spring:
  profiles:
    active: local  # Default to local profile (root/root). Use -Dspring.profiles.active=prod for production
  application:
    name: role-service

  threads:
    virtual:
      enabled: true   # Java 21 Virtual Threads

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:33062/game_role?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  cache:
    type: redis

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

management:
  endpoints:
    web.exposure.include: health,info,metrics,env,threaddump,loggers
  endpoint.health.probes.enabled: true

eureka:
  instance:
    prefer-ip-address: true
    metadata-map:
      grpc.port: 9410  # Expose gRPC port in metadata
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

# Role Service Configuration
role:
  max-level: 150
  max-roles-per-user: 3
  initial-fight-power: 100
  level-rewards:
    gold-per-level: 1000
    item-reward-interval: 10
  config:
    roleexp-path: gameworld/logicconfig/roleexp.json
    rolename-path: gameworld/logicconfig/role_name.json
    refresh-interval-ms: 60000
    startup-retry-count: 6
    startup-retry-delay-ms: 2000

# Skill / Talent Config
skill:
  config:
    single-skill-path: ${SKILL_SINGLE_SKILL_PATH:gameworld/skill/single_skill.json}
    passive-skill-path: ${SKILL_PASSIVE_SKILL_PATH:gameworld/skill/passive_skill.json}
    default-max-level: ${SKILL_DEFAULT_MAX_LEVEL:20}
    refresh-interval-ms: ${SKILL_CONFIG_REFRESH_MS:60000}
  economy:
    enabled: ${SKILL_ECONOMY_ENABLED:true}
    currency-item-id: ${SKILL_ECONOMY_CURRENCY_ITEM_ID:1}
    skill-base-cost: ${SKILL_BASE_COST:100}
    skill-step-cost: ${SKILL_STEP_COST:20}
    talent-base-cost: ${TALENT_BASE_COST:120}
    talent-step-cost: ${TALENT_STEP_COST:25}
    one-key-discount-percent: ${SKILL_ONEKEY_DISCOUNT_PERCENT:0}

