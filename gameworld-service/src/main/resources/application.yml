server:
  port: 8105

# gRPC Server Configuration
grpc:
  server:
    port: 9105
    address: 0.0.0.0
    max-inbound-message-size: 4194304  # 4MB
    keep-alive-time: 30s
    keep-alive-timeout: 10s
    permit-keep-alive-without-calls: true
    max-connection-idle: 5m
    max-connection-age: 30m

spring:
  profiles:
    active: local  # Default to local profile
  application:
    name: gameworld-service
  threads:
    virtual:
      enabled: true   # Java 21 Virtual Threads
  
  # Stateless service - No database needed (calls other services via gRPC)
  # datasource:
  #   url: jdbc:mysql://localhost:3308/game_gameworld?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
  #   username: tpnam
  #   password: 121831
  #   driver-class-name: com.mysql.cj.jdbc.Driver
  #
  # jpa:
  #   hibernate:
  #     ddl-auto: update
  #   show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: gameworld-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

eureka:
  instance:
    prefer-ip-address: true
    metadata-map:
      grpc.port: 9105  # Expose gRPC port in metadata
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

# GameWorld Service Configuration
gameworld:
  map:
    width: 10000
    height: 10000
  position-update-interval: 100  # ms
  nearby-player-radius: 500      # units
  max-players-per-map: 1000
