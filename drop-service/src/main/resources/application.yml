server:
  port: 8250

spring:
  profiles:
    active: local  # Default to local profile
  application:
    name: drop-service

  threads:
    virtual:
      enabled: true

  # No database needed - loads drop tables from XML via config-service (Feign)
  # datasource:
  #   url: jdbc:mysql://localhost:3313/drop_db
  #   username: ${DB_USERNAME:root}
  #   password: ${DB_PASSWORD:1234}

  # jpa:
  #   hibernate:
  #     ddl-auto: update

  # flyway:
  #   enabled: false

  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  config:
    serviceName: config-service
    dropPathTemplate: gameworld/drop/%s.xml
    knownDropIds: []
    # Normalized from actual config-service files (714 XML tables)
    knownDropRanges:
      - 2000-2197
      - 2200-2214
      - 2300-2310
      - 2500-2533
      - 3001-3003
      - 3101-3120
      - 3205-3208
      - 3210
      - 3212
      - 3214
      - 3216
      - 3218
      - 3220-3221
      - 4001-4422

drop:
  config:
    redis-enabled: true
    redis-ttl-hours: 24
    allow-remote-fallback-on-miss: false
    preload-on-startup: true
    health-sample-limit: 20

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics
